[project]
name = "gabriella-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "openai>=3.46.0",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "seed", "tests"]
